name: Model Risk CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  audit-and-test:
    name: Lint, Type-Check, and Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Runtime and Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r requirements-dev.txt

      - name: Verify Repo Cleanliness & Hygiene
        run: |
          # Ensure no synthetic data in production backend
          if grep -rn "generate_synthetic_training_data" backend/; then
            echo "FAILED: Found synthetic training data references in production code."
            exit 1
          fi

      - name: Lint and Syntax Validation
        run: |
          python -m flake8 backend/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: Run Full Test Suite with Strict Coverage Gate (>=80% on services/)
        run: |
          pytest --cov=backend/app/services --cov-report=term-missing --cov-fail-under=80
