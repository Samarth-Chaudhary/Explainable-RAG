[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xai-rag"
version = "0.1.0"
description = "Explainable credit-risk decision-auditing and remediation platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "xgboost>=3.0.0",
    "scikit-learn>=1.4.0",
    "shap>=0.50.0",
    "dice-ml>=0.11",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.10.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "PyYAML>=6.0.0",
    "scipy>=1.14.0",
    "pymupdf>=2.0.0",
    "rank-bm25>=0.2.2",
    "sqlalchemy>=2.0.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = "-v --tb=short"

[tool.pyright]
extraPaths = [".."]

